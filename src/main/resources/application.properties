spring.application.name=secretaria
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/secretaria?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Log das queries SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
spring.security.filter.order=10

# LOG DETALHADO DO SPRING SECURITY
logging.level.org.springframework.security=DEBUG
logging.level.com.universidade.secretaria=DEBUG

# Thymeleaf
logging.level.org.thymeleaf=DEBUG
spring.thymeleaf.prefix=classpath:/templates/html/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# Mostrar todos os templates carregados
debug=true

# Para evitar problemas de bean overriding (se necessário)
spring.main.allow-bean-definition-overriding=true