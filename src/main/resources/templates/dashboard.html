<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #343a40; padding: 20px; }
        .sidebar .nav-link { color: #f8f9fa; }
        .sidebar .nav-link.active { background-color: #495057; }
        .content { padding: 20px; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar text-white">
        <h2 class="mb-4">Fitec</h2>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/historico-academico">Histórico Acadêmico</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Cursos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Professores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Turmas</a>
            </li>
        </ul>
        <hr class="my-4 text-white">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light w-100">Sair</button>
        </form>
    </div>

    <div class="content flex-grow-1">
        <h1 class="mb-4">Bem-vindo<span th:text="${username}">!</span></h1>
        <p>Selecione uma opção no menu lateral para visualizar o conteúdo.</p>

        <div id="main-content-area">
        </div>
    </div>
</div>
</body>
</html>
