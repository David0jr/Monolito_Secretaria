<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Fitec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #e0f7fa; /* Um azul claro suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .card-header-custom {
            font-size: 2.5em;
            font-weight: bold;
            color: #007bb6; /* Azul Fitec */
            margin-bottom: 15px;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 10px 15px;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #007bb6;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 198, 0.25);
        }
        .btn-primary-custom {
            background-color: #007bb6; /* Azul Fitec */
            border-color: #007bb6;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }
        .btn-primary-custom:hover {
            background-color: #005a8a; /* Azul Fitec mais escuro no hover */
            border-color: #005a8a;
            transform: translateY(-2px);
        }
        .error-message {
            color: #dc3545;
            margin-top: 15px;
            font-weight: 500;
        }
        .profile-select-container {
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .profile-option {
            background-color: #f0f8ff; /* Fundo leve para as opções */
            border: 1px solid #cceeff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center; /* Centraliza horizontalmente */
            font-weight: 600;
            color: #007bb6;
            font-size: 1.05em;
        }
        .profile-option:hover {
            background-color: #e6f7ff;
            border-color: #99ddff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 123, 198, 0.1);
        }
        .profile-option.selected {
            background-color: #007bb6;
            color: #ffffff;
            border-color: #005a8a;
            box-shadow: 0 5px 20px rgba(0, 123, 198, 0.3);
            transform: scale(1.02);
        }
        .profile-option i {
            margin-right: 10px;
            font-size: 1.2em;
        }
        .welcome-text {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .alert {
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card-header-custom">
        Fitec
    </div>
    <p class="welcome-text">Bem-vindo(a) à plataforma Fitec! Faça login para continuar.</p>

    <form id="loginForm" th:action="@{/perform_login}" method="post">
        <div class="mb-3 text-start">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3 text-start">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="profile-select-container">
            <!-- CAMPO MODIFICADO: mudado de 'profile' para 'userType' -->
            <input type="hidden" id="selectedProfile" name="userType" value="" required>

            <div class="profile-option" data-profile="ALUNO">
                <i class="fas fa-user-graduate"></i> Entrar como Aluno
            </div>
            <div class="profile-option" data-profile="PROFESSOR">
                <i class="fas fa-chalkboard-teacher"></i> Entrar como Professor
            </div>
            <div class="profile-option" data-profile="SECRETARIA">
                <i class="fas fa-building"></i> Entrar como Secretaria
            </div>
            <div id="profileError" class="error-message" style="display:none;">Por favor, selecione um perfil.</div>
        </div>

        <!-- Mensagens de erro do sistema -->
        <div th:if="${param.error}" class="alert alert-danger">
            Credenciais inválidas ou perfil incorreto.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Logout realizado com sucesso.
        </div>

        <button type="submit" class="btn btn-primary-custom w-100">Entrar</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline='javascript'>
    document.addEventListener('DOMContentLoaded', function() {
        const profileOptions = document.querySelectorAll('.profile-option');
        const selectedProfileInput = document.getElementById('selectedProfile');
        const loginForm = document.getElementById('loginForm');
        const profileError = document.getElementById('profileError');

        profileOptions.forEach(option => {
            option.addEventListener('click', function() {
                profileOptions.forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedProfileInput.value = this.dataset.profile;
                profileError.style.display = 'none'; // Esconde o erro ao selecionar
            });
        });

        loginForm.addEventListener('submit', function(event) {
            if (selectedProfileInput.value === '') {
                profileError.style.display = 'block'; // Mostra o erro se nenhum perfil for selecionado
                event.preventDefault(); // Impede o envio do formulário
            }
        });

        // Auto-selecionar baseado no parâmetro de erro (opcional)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            profileError.style.display = 'block';
        }
    });
</script>
</body>
</html>
