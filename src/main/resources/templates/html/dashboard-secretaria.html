<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Dashboard da Secretaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_secretaria.css">
</head>
<body>
<div class="d-flex">
    <div class="sidebar text-white">
        <h2 class="mb-4">Fitec</h2>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/home" id="home-link">Início</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/cursos" id="cursos-link">Cursos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/disciplinas" id="disciplinas-link">Disciplinas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/turmas" id="turmas-link">Turmas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/professores" id="professores-link">Professores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/alunos" id="alunos-link">Alunos</a>
            </li>
        </ul>
        <hr class="my-4 text-white">
        <!-- SOLUÇÃO: Formulário para logout -->
        <form th:action="@{/logout}" method="post" style="display: inline; width: 100%;">
            <button type="submit" class="btn btn-outline-light w-100">Sair</button>
        </form>
    </div>

    <div class="content flex-grow-1">
        <div style="position: relative; z-index: 1;">
            <div id="main-content-area">
            </div>
        </div>
    </div>
</div>

<script src="../js/dashboard-secretaria.js"></script>
</body>
</html>
