<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_professor.css">
</head>
<body>
<div class="d-flex">
    <div class="sidebar text-white">
        <h2 class="mb-4">Fitec</h2>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/home">Início</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/minhas-disciplinas">Minhas Disciplinas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/lancar-notas">Lançar Notas</a>
            </li>
        </ul>
        <hr class="my-4 text-white">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light w-100">Sair</button>
        </form>
    </div>

    <div class="content flex-grow-1">
        <h1 class="mb-4">Bem-vindo(a), Professor(a)!</h1>
        <p>Selecione uma opção no menu lateral para visualizar seu conteúdo.</p>

        <div id="main-content-area">
        </div>
    </div>
</div>
<script src="../js/dashboard-professor.js"></script>
</body>
</html>
